services:
  # ---------------------------------------------------------------------------
  # AINA FastAPI Backend Web Service
  # ---------------------------------------------------------------------------
  - type: web
    name: aina-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn aina.app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: AINA_ENV
        value: production

  # ---------------------------------------------------------------------------
  # AINA Prototype Frontend Static Site
  # ---------------------------------------------------------------------------
  - type: web
    name: aina-frontend
    runtime: static
    rootDir: prototype
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_CHATBOT_API_URL
        fromService:
          type: web
          name: aina-backend
          property: host
      - key: VITE_USE_MOCK
        value: "false"
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_PUBLISHABLE_KEY
        sync: false
