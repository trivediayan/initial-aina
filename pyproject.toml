[project]
name = "aina-backend"
version = "0.1.0"
description = "AI-powered heritage and tourism curator"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "httpx",
    "pydantic",
    "python-dotenv",
]

[dependency-groups]
dev = [
    "workers-py>=1.9.0",
    "workers-runtime-sdk",
    "pytest>=8.0",
    "anyio>=4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
